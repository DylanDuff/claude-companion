[package]
name = "claude-companion"
version = "0.1.0"
edition = "2024"
description = "Floating chat window for Claude Code, toggled with a global hotkey"
publish = false

[dependencies]
# Official Zed-published GPUI. Keep any gpui-component style crates out: they
# build on a different GPUI fork (gpui-pre) whose types don't interoperate.
# runtime_shaders compiles Metal shaders at launch, so building doesn't need
# Xcode's separate Metal toolchain download.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
global-hotkey = "0.9.0"
# Pinned: 0.13.5+ are younger than the 15-day minimum release age.
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
# Pure-Rust regex engine (no oniguruma C build) with the bundled grammars.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-segmentation = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "0.2"
raw-window-handle = "0.6"

[package.metadata.bundle]
name = "Claude Companion"
identifier = "dev.dylan.claude-companion"
osx_minimum_system_version = "13.0"

[lints.rust]
# objc 0.2's msg_send! expands a `feature = "cargo-clippy"` check into our crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
